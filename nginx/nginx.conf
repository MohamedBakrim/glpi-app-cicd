# =============================================================================
#  Base nginx config for the GLPI frontend image.
#
#  This file deliberately contains NO server block. The chart mounts its own
#  server config at /etc/nginx/conf.d/default.conf (ConfigMap subPath), and the
#  image ships a default there so the same image also runs standalone (compose).
#
#  Runs as a non-root UID, so every writable path is redirected to /tmp — mount
#  an emptyDir there when the pod's root filesystem is read-only.
# =============================================================================

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    # Must be >= PHP upload_max_filesize/post_max_size, otherwise document
    # uploads fail with 413 while PHP is perfectly happy.
    client_max_body_size 100m;
    client_body_buffer_size 128k;

    # writable temp paths for the non-root user
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    application/xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
