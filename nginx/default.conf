# Default vhost shipped inside the image.
#
# In Kubernetes this file is replaced by the chart's ConfigMap
# (<fullname>-nginx at /etc/nginx/conf.d/default.conf, subPath default.conf).
# It exists so the image is runnable on its own — ci/docker-compose.test.yml
# boots exactly this file, which is why the smoke test proves something real.
#
# Port note: 8080 because the chart runs nginx with runAsUser 82 and
# capabilities.drop=[ALL] — binding :80 needs CAP_NET_BIND_SERVICE. The chart's
# Service keeps port 80 and targets the named port "http", so clients are
# unaffected when containerPort is 8080.

upstream glpi_fpm {
    server glpi-php:9000;
    keepalive 16;
}

server {
    listen      8080;
    server_name _;

    root  /var/www/html/public;
    index index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # GLPI entry points. GLPI 12 uses /api.php (the legacy /apirest.php is
    # kept here for older releases). Both use PATH_INFO (/api.php/v1/...), so
    # only the script part is existence-checked.
    location ~ ^/(index|apirest|api|caldav|status)\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_pass glpi_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        # Forward the original Host/scheme through the proxy hops.
        fastcgi_param HTTP_HOST                $http_host;
        fastcgi_param SERVER_NAME              $host;
        fastcgi_param HTTPS                    $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_HOST    $http_x_forwarded_host if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO   $http_x_forwarded_proto if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PORT    $http_x_forwarded_port if_not_empty;

        fastcgi_read_timeout 600s;
        fastcgi_buffers      16 16k;
        fastcgi_buffer_size  32k;
        fastcgi_keep_conn    on;
    }

    # Webpack output is content-hashed, so long caching is safe.
    location ~* \.(css|js|mjs|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires   7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
