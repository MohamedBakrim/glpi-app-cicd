services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      TZ: UTC
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Dhudson.model.DownloadService.noSignatureCheck=false"
    volumes:
      - jenkins_home:/var/jenkins_home
      # The pipeline talks to the host daemon. Equivalent to giving the container
      # root on the host — read the security note in README-CICD.md before shipping.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      # DOCKER_GID=$(getent group docker | cut -d: -f3) — put it in .env
      - "${DOCKER_GID:?run: echo DOCKER_GID=$(getent group docker | cut -d: -f3) > .env}"
    networks:
      - ci

volumes:
  jenkins_home:

networks:
  ci:
